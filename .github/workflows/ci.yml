name: ci
on:
  push:
  pull_request:
jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: gofmt -w cmd
      - run: git diff --exit-code
      - run: go test ./...
      - run: go build ./cmd/amirender-node ./cmd/amirender-controller
