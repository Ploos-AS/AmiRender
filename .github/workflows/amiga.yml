name: Amiga build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  amiga-build:
    runs-on: ubuntu-latest
    env:
      AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
      AMIGA_CPU_PROFILE: "68000"
    steps:
      - uses: actions/checkout@v4
      - name: Pull amiga-dev
        run: docker pull "$AMIGA_DEV_IMAGE"
      - name: Verify amiga-dev contract
        run: docker run --rm "$AMIGA_DEV_IMAGE" amiga-check
      - name: Build AmiRender Amiga client
        run: |
          docker run --rm \
            -e AMIGA_CPU_PROFILE="$AMIGA_CPU_PROFILE" \
            -v "$PWD:/workspace" \
            "$AMIGA_DEV_IMAGE" \
            amiga-build sh -ec 'cd clients/amiga && make clean && make TARGET=/tmp/amirender CC=m68k-amigaos-gcc CFLAGS="$AMIGA_CPU_FLAGS -Os -Wall -Wextra -Werror" && test -s /tmp/amirender && amiga-inspect /tmp/amirender'

# M1 uses :edge as the consumer-integration gate. Pin to a qualified immutable
# amiga-dev sha-* tag or digest before release qualification.
