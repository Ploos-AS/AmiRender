name: Amiga build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  amiga-build:
    runs-on: ubuntu-latest
    env:
      AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
      AMIGA_CPU_PROFILE: "68000"
    steps:
      - uses: actions/checkout@v4
      - name: Pull amiga-dev
        run: docker pull "$AMIGA_DEV_IMAGE"
      - name: Verify amiga-dev contract
        run: docker run --rm "$AMIGA_DEV_IMAGE" amiga-check
      - name: Build and stage AmiRender Amiga client
        run: |
          mkdir -p amiga-runtime-payload/C amiga-runtime-payload/S
          chmod 0777 amiga-runtime-payload/C
          cp clients/amiga/runtime/amiga-runtime.json amiga-runtime-payload/
          cp clients/amiga/runtime/run-test amiga-runtime-payload/S/
          docker run --rm \
            -e AMIGA_CPU_PROFILE="$AMIGA_CPU_PROFILE" \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/amiga-runtime-payload/C:/out" \
            "$AMIGA_DEV_IMAGE" \
            amiga-build sh -ec 'cd /workspace/clients/amiga && make TARGET=/out/amirender CC=m68k-amigaos-gcc CFLAGS="$AMIGA_CPU_FLAGS -Os -Wall -Wextra -Werror" && test -s /out/amirender && amiga-inspect /out/amirender'
          test -s amiga-runtime-payload/C/amirender
      - name: Upload classic runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: amirender-m1-amiga-runtime-payload
          path: amiga-runtime-payload/
          if-no-files-found: error

# M1 uses :edge as the consumer-integration gate. Pin to a qualified immutable
# amiga-dev sha-* tag or digest before release qualification.
